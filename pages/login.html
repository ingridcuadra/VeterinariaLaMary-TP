<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="stylesheet" href="../styles/login.css">
    <script defer src="../scripts/login.js"></script>
    <title>Login - Veterinaria La Mary</title>
</head>

<body class="d-flex flex-column min-vh-100">
    <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5 mt-5">
        <section class="container d-flex justify-content-center align-items-center flex-column">
            <div class="login-wrapper">
                <button type="button" class="btn btn-link text-underline" id="btnVolver">
                    <i class="fa-solid fa-arrow-left"></i>
                    Volver
                </button>

                <div class="login-container">
                    <h2 class="text-center mb-4">Iniciar sesión</h2>

                    <form class="mt-4" id="formInicio">
                        <div class="mb-3">
                            <label for="usuario" class="form-label">Usuario</label>
                            <input type="text" class="form-control" name="usuario" id="usuario"
                                placeholder="Ingresá tu nombre de usuario">
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="password" name="password"
                                placeholder="Ingresá tu contraseña">
                        </div>

                        <span id="msjError"></span>

                        <button type="submit" class="btn btn-primary w-100" id="inicioSesion">
                            <span id="texto-login">Iniciar sesión</span>

                            <span id="spinner-login" class="spinner-border spinner-border-sm ms-2 d-none" role="status"
                                aria-hidden="true">
                            </span>
                        </button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer p-4 mt-5">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
            <div class="footer-info d-flex align-items-center gap-3">
                <img src="../assets/imgs/logo.png" alt="Logo Veterinaria La Mary">
                <p class="text-primary mb-0">Estamos para cuidar a tus mascotas.</p>
            </div>
            <p class="mb-0">© 2026 Veterinaria La Mary.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
</body>

</html>
